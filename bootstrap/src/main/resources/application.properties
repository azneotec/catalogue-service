spring.application.name=catalogue-service
# Replaced with the Gradle project version at build time (see bootstrap/build.gradle.kts).
catalogue.version=@project.version@

# Virtual threads for request handling (required by the conventions; ADR-005).
spring.threads.virtual.enabled=true

# The platform's shared Postgres, database "catalogue", login "catalogue" (ADR-028).
# Defaults match ticketing-platform/.env.example; override with environment variables.
spring.datasource.url=jdbc:postgresql://${CATALOGUE_DB_HOST:localhost}:${CATALOGUE_DB_PORT:5432}/catalogue
spring.datasource.username=${CATALOGUE_DB_USER:catalogue}
spring.datasource.password=${CATALOGUE_DB_PASSWORD:catalogue-local-dev}
# Postgres allows 60 connections for all services together; this service needs few.
spring.datasource.hikari.maximum-pool-size=5

# Flyway (migrations in adapter-persistence) owns the schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
# No database access while rendering responses: queries happen inside the adapters' transactions.
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# gRPC server for other services (ADR-010, ADR-034). Reflection on, so grpcurl works without .proto
# files; the standard gRPC health service is on too.
spring.grpc.server.port=${GRPC_PORT:9090}
spring.grpc.server.shutdown.grace-period=10s

# Origins allowed to call the public API from a browser (the web shell's Vite dev server).
catalogue.cors.allowed-origins=${CATALOGUE_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# OpenAPI (springdoc): spec at /v3/api-docs(.yaml), Swagger UI at /swagger-ui.html.
# Keys sorted, so the committed docs/openapi.yaml only changes when the API does.
springdoc.writer-with-order-by-keys=true
# Wait for in-flight requests on SIGTERM instead of cutting them off.
server.shutdown=graceful
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# --- Observability (ADR-007, ADR-034) ---------------------------------------------------------
# Micrometer Observation instruments HTTP, gRPC, JDBC and the use cases; the OpenTelemetry SDK
# exports traces, metrics and logs over OTLP/HTTP to the local otel-lgtm container.
# service.name comes from spring.application.name.
management.opentelemetry.resource-attributes.service.version=${catalogue.version}
management.opentelemetry.resource-attributes.deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:local}
# Locally every request is traced; in a real environment this would be a fraction.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
# Push metrics every 15 s (default 1 min) so a dashboard reacts while we watch.
management.otlp.metrics.export.step=15s
# The same tags on every metric, so Prometheus queries can filter by service.
management.metrics.tags.service=${spring.application.name}
# JDBC spans: one per connection and per statement; result-set reads would add a span per row batch.
jdbc.includes=CONNECTION,QUERY
