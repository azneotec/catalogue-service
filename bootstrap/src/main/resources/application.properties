spring.application.name=catalogue-service

# Virtual threads for request handling (required by the conventions; ADR-005).
spring.threads.virtual.enabled=true

# The platform's shared Postgres, database "catalogue", login "catalogue" (ADR-028).
# Defaults match ticketing-platform/.env.example; override with environment variables.
spring.datasource.url=jdbc:postgresql://${CATALOGUE_DB_HOST:localhost}:${CATALOGUE_DB_PORT:5432}/catalogue
spring.datasource.username=${CATALOGUE_DB_USER:catalogue}
spring.datasource.password=${CATALOGUE_DB_PASSWORD:catalogue-local-dev}
# Postgres allows 60 connections for all services together; this service needs few.
spring.datasource.hikari.maximum-pool-size=5

# Flyway (migrations in adapter-persistence) owns the schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
# No database access while rendering responses: queries happen inside the adapters' transactions.
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# gRPC server for other services (ADR-010, ADR-034). Reflection on, so grpcurl works without .proto
# files; the standard gRPC health service is on too.
spring.grpc.server.port=${GRPC_PORT:9090}
spring.grpc.server.shutdown.grace-period=10s

# Origins allowed to call the public API from a browser (the web shell's Vite dev server).
catalogue.cors.allowed-origins=${CATALOGUE_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# OpenAPI (springdoc): spec at /v3/api-docs(.yaml), Swagger UI at /swagger-ui.html.
# Keys sorted, so the committed docs/openapi.yaml only changes when the API does.
springdoc.writer-with-order-by-keys=true
# Wait for in-flight requests on SIGTERM instead of cutting them off.
server.shutdown=graceful
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
