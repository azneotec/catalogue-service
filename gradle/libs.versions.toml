# Libraries used by catalogue-service. Spring-managed ones carry no version here:
# the Spring Boot BOM (applied by ticketing.spring-boot-conventions) pins them.
[versions]
# Not managed by Spring Boot. 3.2.x is built against Spring Boot 4.1.
springdoc = "3.2.0"
# Our gRPC contracts (mavenLocal) and the grpc-java version they were built with. Spring Boot's
# BOM pins grpc-java 1.84.1; the grpc BOM aligns every io.grpc module to the contracts' version,
# because mixed grpc-java versions fail at runtime.
ticketing-contracts = "0.1.1"
grpc = "1.85.1"
# JDBC spans (Micrometer Observation around the DataSource). 2.3.x is built against Boot 4.1.
datasource-micrometer = "2.3.0"
# Bridges Logback to the OpenTelemetry SDK so logs go out over OTLP. 2.28.x is the instrumentation
# release built on OpenTelemetry 1.62, the version Spring Boot 4.1.2 manages; a newer one would mix
# OpenTelemetry API and SDK versions.
otel-logback-appender = "2.28.0-alpha"

[libraries]
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-grpc-server = { module = "org.springframework.boot:spring-boot-starter-grpc-server" }
spring-boot-starter-grpc-server-test = { module = "org.springframework.boot:spring-boot-starter-grpc-server-test" }
spring-boot-starter-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }
datasource-micrometer = { module = "net.ttddyy.observation:datasource-micrometer-spring-boot", version.ref = "datasource-micrometer" }
otel-logback-appender = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "otel-logback-appender" }
spring-boot-micrometer-tracing-test = { module = "org.springframework.boot:spring-boot-micrometer-tracing-test" }
otel-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing" }
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess" }
grpc-services = { module = "io.grpc:grpc-services" }
ticketing-contracts-grpc = { module = "io.github.azneotec.ticketing:ticketing-contracts-grpc", version.ref = "ticketing-contracts" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
