# Test-only settings for the persistence adapter. The datasource comes from Testcontainers
# (@ServiceConnection), so no URL or password here.
spring.jpa.open-in-view=false
# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Count statements in tests (N+1 check).
spring.jpa.properties.hibernate.generate_statistics=true
# Print every SQL statement Hibernate sends, and the values bound to it.
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=warn
